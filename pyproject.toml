[project]
name = "clicker"
version = "0.0.0"
description = "Home Assistant integration for sub-GHz RF remotes"
requires-python = ">=3.14"

[tool.ruff]
line-length = 100
target-version = "py314"
# Derived from rf_device_manager; kept close to upstream, so not reformatted.
extend-exclude = [
    "custom_components/clicker/core/decoders.py",
    "custom_components/clicker/core/rf_analysis.py",
    "tests/test_decoders.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.14"
follow_imports = "silent"
files = [
    "custom_components/clicker/core/models.py",
    "custom_components/clicker/core/encoder.py",
    "custom_components/clicker/core/stream.py",
    "custom_components/clicker/core/receive.py",
    "custom_components/clicker/core/matcher.py",
    "custom_components/clicker/core/importer.py",
    "custom_components/clicker/core/const.py",
    "custom_components/clicker/core/__init__.py",
]
mypy_path = "custom_components/clicker"
