import_rf_device_manager:

send_command:
  fields:
    device:
      required: true
      example: "Patio Fan"
      selector:
        text:
    command:
      required: true
      example: "Power"
      selector:
        text:
    frames_on_air:
      required: false
      selector:
        number:
          min: 1
          max: 64
          mode: box

set_assumed_state:
  target:
    entity:
      integration: clicker
      domain: fan
  fields:
    is_on:
      selector:
        boolean:
    percentage:
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    oscillating:
      selector:
        boolean:
    direction:
      selector:
        select:
          options:
            - forward
            - reverse
