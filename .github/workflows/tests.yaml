name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -I tests/test_decoders.py
      - run: python -I tests/test_encoder.py
      - run: python -I tests/test_models.py
      - run: python -I tests/test_stream.py
      - run: python -I tests/test_receive.py
      - run: python -I tests/test_matcher.py
      - run: python -I tests/test_importer.py
      - run: python -I tests/test_learn.py
      - run: python -I tests/test_radios.py
      - run: python -I tests/test_edit.py
      - run: python -I tests/test_fan.py
      - run: python -I tests/test_onoff.py
      - run: python -I tests/test_cover.py
      - run: python -I tests/test_sources.py
      - run: python -I tests/test_export.py
      - run: python -I tools/report.py

  homeassistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements_test.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest

  panel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: panel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
