name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - run: python -I tests/test_decoders.py
      - run: python -I tests/test_encoder.py
      - run: python -I tests/test_models.py
      - run: python -I tests/test_stream.py
      - run: python -I tests/test_receive.py
      - run: python -I tests/test_matcher.py
      - run: python -I tests/test_importer.py
      - run: python -I tests/test_learn.py
      - run: python -I tests/test_radios.py
      - run: python -I tests/test_edit.py
      - run: python -I tests/test_fan.py
      - run: python -I tests/test_onoff.py
      - run: python -I tests/test_cover.py
      - run: python -I tests/test_sources.py
      - run: python -I tests/test_export.py
      - run: python -I tools/report.py

  homeassistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - run: pip install -r requirements_test.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest

  panel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: panel
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
