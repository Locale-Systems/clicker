name: Tests

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -I tests/test_decoders.py
      - run: python -I tests/test_encoder.py
      - run: python -I tools/report.py
