name: Release

# To release, either:
#   - GitHub → Releases → "Draft a new release" → create a new tag such as v0.3.0 → Publish, or
#   - push a tag:  git tag v0.3.0 && git push origin v0.3.0  (the release gets generated notes)
# The tag sets the version, so manifest.json (which keeps a placeholder) is not
# bumped first. This runs the tests, builds the panel, and attaches clicker.zip,
# what HACS installs, to the release.

on:
  push:
    tags: ["v*"]

# Read-only by default; only the release job, which publishes, can write.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}

jobs:
  tests:
    uses: ./.github/workflows/tests.yaml

  release:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Set the version from the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not a version tag like v1.2.3 or v1.2.3-beta.1"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          python3 - "${version}" <<'PY'
          import json, pathlib, sys
          path = pathlib.Path("custom_components/clicker/manifest.json")
          manifest = json.loads(path.read_text())
          manifest["version"] = sys.argv[1]
          path.write_text(json.dumps(manifest, indent=2) + "\n")
          PY

      - name: Build the panel
        working-directory: panel
        run: |
          npm ci
          npm run build

      - name: Build clicker.zip
        run: |
          (cd custom_components/clicker && zip -q -r -X ../../clicker.zip . -x '*__pycache__*' '*.pyc')
          # HACS unpacks the zip into custom_components/clicker: the files sit at its root.
          unzip -Z1 clicker.zip > "${RUNNER_TEMP}/contents"
          grep -qx manifest.json "${RUNNER_TEMP}/contents"
          grep -qx frontend/clicker-panel.js "${RUNNER_TEMP}/contents"
          unzip -p clicker.zip manifest.json > "${RUNNER_TEMP}/manifest.json"
          grep -q "\"version\": \"${{ steps.version.outputs.version }}\"" "${RUNNER_TEMP}/manifest.json"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            # Published from the Releases page; attach the build to it.
            gh release upload "${GITHUB_REF_NAME}" clicker.zip --clobber
          else
            prerelease=()
            case "${GITHUB_REF_NAME}" in *-*) prerelease=(--prerelease) ;; esac
            gh release create "${GITHUB_REF_NAME}" clicker.zip --verify-tag \
              --title "Clicker ${VERSION}" --generate-notes "${prerelease[@]}"
          fi
