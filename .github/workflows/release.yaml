name: Release

# Publishes the GitHub release for a release tag (what HACS installs) as the
# locale-ci-publish GitHub App, not a personal account.
#
# A release is an annotated tag `v<version>` matching the manifest's version:
# its subject is the release title and its body the release notes (Markdown).
# Run the workflow by hand with a tag to release one that already exists.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (for example v0.2.0)
        required: true

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'Locale-Systems/clicker'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the tag
        id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # actions/checkout can leave the triggering tag lightweight; fetch
          # the tag object itself, which carries the release notes.
          git fetch --force --no-tags origin "refs/tags/${TAG}:refs/tags/${TAG}"
          if [ "$(git cat-file -t "$TAG")" != tag ]; then
            echo "::error::$TAG is not an annotated tag" >&2
            exit 1
          fi
          version="$(git show "${TAG}:custom_components/clicker/manifest.json" \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["version"])')"
          if [ "v${version}" != "$TAG" ]; then
            echo "::error::$TAG does not match the manifest's version ${version}" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Mint a token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.LOCALE_CI_PUBLISH_CLIENT_ID }}
          private-key: ${{ secrets.LOCALE_CI_PUBLISH_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: clicker

      - name: Publish the release
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$TAG is already released"
            exit 0
          fi
          git tag -l --format='%(contents:body)' "$TAG" \
            | sed '/^-----BEGIN \(PGP\|SSH\) SIGNATURE-----/,$d' > notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$(git tag -l --format='%(contents:subject)' "$TAG")" \
            --notes-file notes.md
